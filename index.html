<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xtremox Page</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(135deg, #0d0d0d 0%, #1a0a0a 50%, #0d0d0d 100%);
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        .container {
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #ff6600;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 0 40px rgba(255, 102, 0, 0.3), 0 0 80px rgba(255, 102, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            color: #ff6600;
            text-shadow: 0 0 20px rgba(255, 102, 0, 0.5);
        }
        .sub {
            color: #cc8800;
            font-size: 1rem;
            margin-bottom: 25px;
            letter-spacing: 2px;
        }
        .btn-play {
            background: transparent;
            border: 2px solid #ff6600;
            color: #ff6600;
            font-size: 1.3rem;
            padding: 14px 40px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .btn-play:hover {
            background: #ff6600;
            color: #0d0d0d;
            box-shadow: 0 0 30px rgba(255, 102, 0, 0.5);
        }
        .btn-play.playing {
            background: #ff6600;
            color: #0d0d0d;
        }
        .status {
            margin-top: 20px;
            font-size: 0.85rem;
            color: #aa6600;
        }
        .status .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #333;
            margin-right: 6px;
            transition: background 0.3s;
            vertical-align: middle;
        }
        .status .dot.on { background: #ff6600; box-shadow: 0 0 10px #ff6600; }
        .halloween-icon {
            font-size: 4rem;
            margin-bottom: 10px;
            display: block;
        }
        .fallback-link {
            display: block;
            margin-top: 15px;
            color: #ff6600;
            font-size: 0.8rem;
            opacity: 0.7;
        }
        .fallback-link:hover { opacity: 1; }
        .error-msg {
            color: #ff4444;
            font-size: 0.8rem;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <span class="halloween-icon">🎃</span>
        <h1>Hola Xtremox Page</h1>
        <p class="sub">SITIO PERSONAL NOMAS</p>

        <button class="btn-play" id="btnPlay">▶ PLAY HALLOWEEN</button>

        <div class="status">
            <span class="dot" id="dot"></span>
            <span id="statusText">Halloween Radio - Main</span>
        </div>
        <div class="error-msg" id="errorMsg"></div>

        <a class="fallback-link" href="https://halloweenradio.net/" target="_blank">Abrir Halloween Radio ↗</a>
    </div>

    <audio id="radio" loop>
        <source src="https://radio1.streamserver.link:8000/hrm-aac" type="audio/aac">
        <source src="https://radio1.streamserver.link:8000/hrm-aac" type="audio/mpeg">
    </audio>

    <script>
        const audio = document.getElementById('radio');
        const btn = document.getElementById('btnPlay');
        const dot = document.getElementById('dot');
        const statusText = document.getElementById('statusText');
        const errorMsg = document.getElementById('errorMsg');

        btn.addEventListener('click', () => {
            if (audio.paused) {
                audio.play().then(() => {
                    btn.textContent = '⏸ PAUSE';
                    btn.classList.add('playing');
                    dot.classList.add('on');
                    statusText.textContent = 'Halloween Radio - EN VIVO 🎃';
                    errorMsg.style.display = 'none';
                }).catch(e => {
                    errorMsg.style.display = 'block';
                    errorMsg.textContent = 'El navegador bloqueó la reproducción. Abrí el enlace de abajo para escuchar.';
                });
            } else {
                audio.pause();
                btn.textContent = '▶ PLAY HALLOWEEN';
                btn.classList.remove('playing');
                dot.classList.remove('on');
                statusText.textContent = 'Halloween Radio - Main';
                errorMsg.style.display = 'none';
            }
        });
    </script>
</body>
</html>
